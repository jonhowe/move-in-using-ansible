---
- name: Ensure opencode config directory exists
  ansible.builtin.file:
    path: "{{ home_directory }}/.config/opencode"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

- name: Ensure the user-local npm prefix exists
  ansible.builtin.file:
    path: "{{ home_directory }}/.local"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

- name: Install OpenCode 2 CLI
  community.general.npm:
    name: "@opencode/cli"
    version: "{{ opencode_npm_version }}"
    global: true
    state: present
  environment:
    HOME: "{{ home_directory }}"
    NPM_CONFIG_PREFIX: "{{ home_directory }}/.local"

- name: Deploy opencode.json
  ansible.builtin.template:
    src: opencode.json.j2
    dest: "{{ home_directory }}/.config/opencode/opencode.json"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0644"
    force: true

- name: Remove the OpenCode 1 tokenscope command file
  ansible.builtin.file:
    path: "{{ home_directory }}/.config/opencode/command/tokenscope.md"
    state: absent
