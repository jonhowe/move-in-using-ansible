---
- name: Install snaps at pinned revisions
  community.general.snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic | bool }}"
    revision: "{{ item.revision | int }}"
  loop: "{{ snaps_classic + snaps_regular }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install optional snap applications at pinned revisions
  community.general.snap:
    name: "{{ item.snap_name }}"
    classic: "{{ item.classic | bool }}"
    revision: "{{ item.revision | int }}"
  loop: "{{ optional_snap_applications }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.enabled | bool
    - item.install_method == "snap"
